name: Feature Request
description: Propose a new feature or enhancement
title: '[FEATURE] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Who is affected and why does it matter?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature clearly and specifically.
    validations:
      required: true

  - type: checkboxes
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Define what "done" looks like for this feature.
      options:
        - label: Feature behaves as described in the proposal
        - label: Unit tests written and passing
        - label: Documentation updated (if applicable)

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider and why were they ruled out?

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Mockups, references, related issues, or any other context.
