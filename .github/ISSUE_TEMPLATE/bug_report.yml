name: Bug Report
description: Report a defect or unexpected behavior
title: '[BUG] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages or stack traces.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System

  - type: input
    id: dotnet-version
    attributes:
      label: .NET Version

  - type: input
    id: project-version
    attributes:
      label: Project Version / Commit

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or related issues.
